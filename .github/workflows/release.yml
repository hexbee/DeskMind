name: "Publish"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Verify pnpm installation
        run: pnpm --version
        shell: bash

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.platform == 'windows-latest'
        run: rustup target add x86_64-pc-windows-msvc
        shell: bash

      - name: Update version in configs
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ github.event.inputs.version }}"/' src-tauri/tauri.conf.json
          sed -i 's/"version": "[^"]*"/"version": "${{ github.event.inputs.version }}"/' package.json
        shell: bash

      - name: Install frontend dependencies
        run: pnpm install
        shell: bash

      - name: Build frontend
        run: pnpm build
        shell: bash

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: "DeskMind v${{ github.event.inputs.version }}"
          releaseBody: |
            See the assets to download
          releaseDraft: true
          prerelease: false
          projectPath: .
          distPath: dist
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc

      - name: Install 7-Zip
        uses: milliewalky/setup-7-zip@v2

      - name: Create portable zip
        run: |
          cd src-tauri/target/release
          7z a DeskMind_${{ github.event.inputs.version }}_portable.zip DeskMind.exe WebView2Loader.dll
        shell: bash

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: src-tauri/target/release/DeskMind_${{ github.event.inputs.version }}_portable.zip
