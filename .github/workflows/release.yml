name: "Publish"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        
      - name: Update version in configs
        shell: bash
        run: |
          # Update version in tauri.conf.json
          sed -i 's/"version": "[^"]*"/"version": "${{ github.event.inputs.version }}"/' src-tauri/tauri.conf.json
          # Update version in package.json
          sed -i 's/"version": "[^"]*"/"version": "${{ github.event.inputs.version }}"/' package.json
          
      - name: Install frontend dependencies
        run: pnpm install
        
      - name: Build (Portable)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: "v${{ github.event.inputs.version }}"
          releaseBody: "Portable Windows build"
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
          bundleType: "portable"
